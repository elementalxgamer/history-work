<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HISTORY.exe</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div class="scanlines"></div>

    <main class="terminal">
        <div class="top">
            <span>●</span>
            <span>●</span>
            <span>●</span>
            <b> HISTORY.exe</b>
        </div>

        <div class="content">
            <p class="green">root@history:~$ system_check</p>
            <p>Loading Vedic Civilization database<span class="dots">...</span></p>

            <div class="question">
                <p>> Do you have the <strong>Vedic Civilization</strong> work?</p>

                <button onclick="reply(true)">[ YES ]</button>
                <button onclick="reply(false)">[ NO ]</button>
            </div>

            <p id="result"></p>
        </div>
    </main>

    <script src="./script.js"></script>
</body>
</html>
